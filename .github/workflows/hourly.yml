name: Hourly YouTube Counter

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write

jobs:
  counter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create token
        env:
          TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          printf '%s' "$TOKEN" > token.json

      - name: Run counter
        run: python counter.py

      - name: Wait one hour
        run: sleep 3600

      - name: Start next run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/dispatches \
            -f event_type=hourly-counter
