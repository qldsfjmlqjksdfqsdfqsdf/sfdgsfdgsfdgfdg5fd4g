name: Hourly YouTube Counter

on:
  schedule:
    - cron: "*/5 * * * *"
      timezone: "Europe/Paris"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-counter
  cancel-in-progress: false

jobs:
  counter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Create token
        env:
          TOKEN: ${{ secrets.YT_TOKEN }}
        run: |
          printf '%s' "$TOKEN" > token.json

      - name: Run counter
        run: python counter.py

      - name: Save history
        run: |
          git config user.name "YouTube Counter Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "Update subscriber history"
          git push
